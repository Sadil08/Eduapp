# Integration-test profile ("it"): full @SpringBootTest context against a THROWAWAY
# scratch database (eduapp_test) so the real eduapp_db is never touched.
# Username/password are inherited from application.properties (same Postgres server).

# Override only the database name -> scratch DB.
spring.datasource.url=jdbc:postgresql://localhost:5432/eduapp_test

# Re-enable autoconfig that the default test props switch off for slice tests.
spring.autoconfigure.exclude=

# Schema is built by Hibernate for now (Flyway cutover is WP-2, tested separately).
# create-drop gives each test RUN a fresh schema in the scratch DB, so data never
# accumulates across runs (which previously caused unique-constraint flakiness).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Real local Redis (available) for cache.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Dummy mail config so the JavaMailSender bean exists (no mail is sent in tests).
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Deterministic secret for token signing in tests.
JWT_SECRET=test-secret-0123456789-0123456789-0123456789
FRONTEND_URL=http://localhost:3000

logging.level.org.springframework=WARN
logging.level.root=WARN
