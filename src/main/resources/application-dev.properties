# Dev profile (N-O1/O2) — activate with SPRING_PROFILES_ACTIVE=dev for local debugging.
# Verbose logging + SQL echo live HERE, not in the base profile (which is safe-by-default INFO).
logging.level.root=DEBUG
logging.level.org.springframework=DEBUG
logging.level.com.eduapp=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
