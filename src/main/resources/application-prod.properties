# Production profile (WP-A0.5) — activate with SPRING_PROFILES_ACTIVE=prod.
# Overrides the dev-friendly defaults in application.properties. All secrets still come
# from the environment (never hardcode here).

# Logging: quiet + no SQL/data leakage into logs (base profile uses DEBUG for local dev).
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.eduapp=INFO

# Never log SQL or render formatted SQL in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Do not leak internals in error responses (also set in base; reasserted here).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# NOTE (WP-A0.7 / WP-2.4, currently on hold): in prod the schema should be owned entirely
# by Flyway — set spring.jpa.hibernate.ddl-auto=validate and
# spring.flyway.validate-on-migrate=true here once the baseline cutover is done.
