spring.application.name=backend
# N-O1: safe-by-default logging (INFO). Use the `dev` profile for DEBUG locally.
logging.level.org.springframework=INFO
logging.level.root=INFO
FRONTEND_URL=http://localhost:3000

# SECURITY (specs/security.md SEC-stacktrace / NFR): never leak stack traces or
# internal details in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Mail Configuration (secrets externalised — see .env / .env.example)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server Configuration (from yml)
server.port=8080
server.max-http-header-size=16384

# SEC-8: only trust X-Forwarded-For for the client IP when behind a trusted reverse proxy/LB
# that overwrites the header. Set true in prod (behind nginx/ALB), keep false otherwise so a
# client can't spoof the header to evade IP rate limits.
app.rate-limit.trust-forwarded-header=${TRUST_FORWARDED_HEADER:false}

# Datasource Configuration (secrets externalised — see .env / .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eduapp_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP connection pool (SCALE-7): sized for production load, not the dev default of 10.
# Leak detection surfaces connections held too long (e.g. a thread blocked on slow I/O).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration (from yml)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# N-O2: SQL logging off by default (huge log volume + can expose query params). On in `dev`.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration (from yml)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.validate-on-migrate=false

# JWT Configuration — the signing secret is read from JWT_SECRET (env) by JwtUtil with
# fail-fast validation. The old literal jwt.secret was unused/misleading and was removed.
jwt.expiration=86400000

# AI extraction service (Python). SEC-1: the backend authenticates to it with a shared secret
# sent as X-API-Key. Empty in local dev; MUST be set (and match the service's SERVICE_API_KEY)
# in every deployed environment so the service can reject any request not from this backend.
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:}

# Gemini & GCP Configuration (from yml)
gemini.model=gemini-2.5-flash
gcp.project-id=${GCP_PROJECT_ID:markit-test-487317}
gcp.location=${GCP_LOCATION:asia-south1}
# N-A3: externalised — empty default → Application Default Credentials (works on GCP/Linux/
# containers). Previously a hardcoded Windows path that broke non-Windows deploys.
gcp.credentials-path=${GCP_CREDENTIALS_PATH:}

# Supabase Storage (S3-compatible)
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT:https://localhost/storage/v1/s3}
supabase.storage.access-key=${SUPABASE_S3_ACCESS_KEY:not-configured}
supabase.storage.secret-key=${SUPABASE_S3_SECRET_KEY:not-configured}
supabase.storage.bucket-name=${SUPABASE_BUCKET_NAME:eduapp-images}
supabase.storage.public-url=${SUPABASE_PROJECT_URL:https://localhost}/storage/v1/object/public/${SUPABASE_BUCKET_NAME:eduapp-images}

# Actuator / Observability (WP-A1.2)
# /actuator/health is public (liveness/readiness probes); the rest are ADMIN-only (see SecurityConfig).
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
# Mail is not a liveness dependency — a down SMTP must not make /health report DOWN (503).
management.health.mail.enabled=false

