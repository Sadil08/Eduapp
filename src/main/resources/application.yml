server:
  port: 8080
  max-http-header-size: 16384

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eduapp_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Changed from 'update' to 'validate' - Flyway handles schema
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5  # Skip V1, V2, V17 - only run V6 and later
    validate-on-migrate: false

jwt:
  secret: mySecretKey
  expiration: 86400000

gemini:
  api-key: AIzaSyAXBcWLowHCx-gtixply20XI4WEiqs4HeQ
  model: gemini-2.5-flash
  api-url: https://generativelanguage.googleapis.com/v1beta
