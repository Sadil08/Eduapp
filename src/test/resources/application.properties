# Test-only properties so slice/context tests can load without external services or a real .env.
# Real secrets come from the environment in non-test runs.

# Resolves @Value("${FRONTEND_URL}") in SecurityConfig (was unresolved -> context failed to load).
FRONTEND_URL=http://localhost:3000

# WP-1.2: JwtUtil fails fast without a >=32-byte secret. Deterministic test value.
JWT_SECRET=test-secret-0123456789-0123456789-0123456789

# Keep slice tests hermetic: no Flyway, no real DB migrations during @WebMvcTest.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Supabase placeholders so any eager config does not fail on missing properties.
SUPABASE_S3_ENDPOINT=http://localhost/storage/v1/s3
SUPABASE_S3_ACCESS_KEY=test
SUPABASE_S3_SECRET_KEY=test
SUPABASE_BUCKET_NAME=eduapp-images
SUPABASE_PROJECT_URL=http://localhost
