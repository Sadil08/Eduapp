spring.application.name=backend
logging.level.org.springframework=DEBUG
logging.level.root=DEBUG
FRONTEND_URL=http://localhost:3000

# SECURITY (specs/security.md SEC-stacktrace / NFR): never leak stack traces or
# internal details in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sadil.ephraims2004@gmail.com
spring.mail.password=erxn wcma gmwk nnvj
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server Configuration (from yml)
server.port=8080
server.max-http-header-size=16384

# Datasource Configuration (from yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/eduapp_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=password

# JPA Configuration (from yml)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration (from yml)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.validate-on-migrate=false

# JWT Configuration (from yml)
jwt.secret=mySecretKey
jwt.expiration=86400000

# Gemini & GCP Configuration (from yml)
gemini.model=gemini-2.5-flash
gcp.project-id=markit-test-487317
gcp.location=asia-south1
gcp.credentials-path=c:/Users/Asus/OneDrive/Desktop/Eduapp/Eduapp/service-account-key.json

# Supabase Storage (S3-compatible)
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT:https://localhost/storage/v1/s3}
supabase.storage.access-key=${SUPABASE_S3_ACCESS_KEY:not-configured}
supabase.storage.secret-key=${SUPABASE_S3_SECRET_KEY:not-configured}
supabase.storage.bucket-name=${SUPABASE_BUCKET_NAME:eduapp-images}
supabase.storage.public-url=${SUPABASE_PROJECT_URL:https://localhost}/storage/v1/object/public/${SUPABASE_BUCKET_NAME:eduapp-images}
